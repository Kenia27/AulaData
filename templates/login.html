{% extends "base.html" %}

{% block contenido %}

<h2>Iniciar sesión</h2>

<form method="POST">

    <label>Usuario</label>
    <input
        type="text"
        name="username"
        required
    >

    <label>Contraseña</label>
    <input
        type="password"
        name="password"
        required
    >

    <button type="submit">
        Entrar
    </button>

</form>

{% endblock %}
